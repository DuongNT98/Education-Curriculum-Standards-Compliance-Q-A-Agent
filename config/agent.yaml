# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors); see the
# distributed framework contract doc's "AgentRegistry manifest schema" section
# for the full contract.
id: "EDU-C2-012"
name: "Education Curriculum Standards & Compliance Q&A Agent"
namespace: "edu"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. QueryClassifyNode / GapAnalysisNode call a real
# LLM (Azure OpenAI) to refine, respectively, intent classification and
# per-standard coverage-level assessment — genuine NL/semantic reasoning the
# deterministic keyword/overlap heuristic in curriculum_service.py can't
# capture. Any failure (missing secret, API error, malformed response)
# silently keeps that deterministic result; the pipeline never hard-fails
# over an LLM outage.
generation_mode: "llm"
industry: "EDU"

# Opaque compatibility metadata (pattern reference only — code inherits
# AgentBaseGraph L1-direct, not RAGAgent).
base_type: "RAGAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.Graph"

# Security — no student PII, public curriculum document.
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# AZURE_OPENAI_API_KEY / AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT: all
# three resolved via ctx.secrets.require(...) inside QueryClassifyNode /
# GapAnalysisNode's execute() (per-invocation, not cached — src/nodes/). None
# of it lives in config/config.yaml — endpoint and deployment are secrets
# here, not runtime config, even though they are not credentials by
# themselves. VECTOR_STORE_API_KEY is deliberately NOT declared: no
# ctx.secrets.require() call for it exists anywhere in src/ (the retriever is
# injected via config, not secrets).
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI

# generation_mode is deployment identity, not a tunable provider setting. Runtime
# parameters (max_retry, timeout_s, top_k, hour_requirements_path, ...) live in
# config/config.yaml — AgentRegistry loads that file separately and passes it
# as Graph(config=...). Do NOT put them here.
